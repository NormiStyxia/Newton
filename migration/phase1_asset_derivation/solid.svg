<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7f5"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ffffff" fill-opacity="0.24"/>
      <rect x="4" y="4" width="4" height="4" fill="#e8efeb" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="64" height="64" fill="url(#base)"/>
  <rect width="64" height="64" fill="url(#grain)"/>
</svg>
